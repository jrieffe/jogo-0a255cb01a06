:root {
  --tinta: #2A1636; --tinta-2: #5A4468; --papel: #FFFAF0; --papel-2: #FFEFD3; --borda: #2A1636;
  --rosa: #C2185B; --rosa-claro: #FFE0EF; --amarelo: #FFE45C; --amarelo-claro: #FFF3B8;
  --verde: #1E7A45; --verde-claro: #E2F6E8; --vermelho: #B42318; --vermelho-claro: #FDE8E6; --azul: #1B5FB8; --roxo: #6A3FC9; --terra: #7A4A1E;
  --sombra: 0 6px 0 rgba(42, 22, 54, .25);
  --fonte-titulo: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --fonte: "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cor-e: #7A4A1E; color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: #5A3A22; color: var(--tinta); font-family: var(--fonte); font-size: 18px; line-height: 1.4; font-weight: 700; overflow-x: hidden; }
button { font-family: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; }
img { display: block; }

/* ---------- mundo de fundo: um cenário (SVG por código) para cada lugar, com partículas à deriva ---------- */
.mundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.mundo-cena { position: absolute; inset: 0; transition: opacity .3s; }
.mundo-cena svg { width: 100%; height: 100%; }
.mundo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(30, 20, 60, .16)); }
.particulas { position: absolute; inset: 0; z-index: 1; }
.particula { position: absolute; bottom: -60px; opacity: .8; animation: subir linear infinite; }
.particula svg { width: 100%; height: 100%; }
@keyframes subir { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(28px, -55vh) rotate(25deg); } 100% { transform: translate(-12px, -115vh) rotate(-20deg); } }
@media (prefers-reduced-motion: reduce) { .particula { display: none; } }

/* ---------- moldura ---------- */
#app { position: relative; z-index: 2; max-width: 920px; margin: 0 auto; padding: 10px 12px 28px; }
.topo { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.marca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--papel); border: 3px solid var(--borda); border-radius: 999px; padding: 3px 14px 3px 4px; box-shadow: var(--sombra); font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.1rem; white-space: nowrap; overflow: hidden; }
.marca img { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--borda); object-fit: cover; }
.marca span { overflow: hidden; text-overflow: ellipsis; }
.placar-topo { display: flex; align-items: center; gap: 4px; background: var(--amarelo-claro); border: 3px solid var(--borda); border-radius: 999px; padding: 6px 12px; font-family: var(--fonte-titulo); font-weight: 800; box-shadow: var(--sombra); white-space: nowrap; }
.placar-topo svg { width: 22px; height: 22px; }
.btn-redondo { width: 50px; height: 50px; flex: none; border-radius: 50%; border: 3px solid var(--borda); background: var(--papel); box-shadow: var(--sombra); display: grid; place-items: center; cursor: pointer; padding: 0; }
.btn-redondo svg { width: 26px; height: 26px; }
.btn-redondo.desligado { background: #E9E4F2; }
.btn-redondo:active, .btn:active, .opcao:active, .caixa:active, .vf-b:active { transform: translateY(3px); }
.cartao { background: var(--papel); border: 3px solid var(--borda); border-radius: 24px; box-shadow: var(--sombra); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; border-radius: 999px; border: 3px solid var(--borda); background: var(--papel); box-shadow: var(--sombra); font-size: 1.1rem; font-weight: 900; cursor: pointer; }
.btn svg { width: 24px; height: 24px; }
.btn-principal { background: var(--rosa); color: #fff; }
.btn-ajuda { background: var(--amarelo); min-height: 48px; padding: 6px 14px; font-size: 1rem; flex: none; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.1; margin: 0; }
.tela { animation: entra .28s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- abertura ---------- */
.hero { overflow: hidden; padding: 0; }
.hero-arte { position: relative; height: 270px; border-bottom: 3px solid var(--borda); }
.hero-arte > svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 21px 21px 0 0; }
.hero-arte .lia { position: absolute; left: 50%; bottom: -22px; width: 190px; height: 190px; transform: translateX(-50%); border-radius: 50%; border: 5px solid var(--borda); background: #FFE0EF; object-fit: cover; box-shadow: var(--sombra); }
.hero-txt { padding: 36px 16px 18px; text-align: center; }
.hero-txt h1 { font-size: clamp(2rem, 7vw, 3rem); color: var(--terra); }
.hero-txt p { margin: 6px 0 0; font-size: 1.1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
.chip { white-space: nowrap; background: var(--amarelo-claro); border: 2px solid var(--borda); border-radius: 999px; padding: 2px 12px; font-size: .95rem; font-weight: 900; }

/* ---------- guia (Lia) + balão ---------- */
.guia { display: flex; align-items: flex-end; gap: 8px; margin: 10px 0; }
.guia-rosto { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid var(--borda); background: #FFE0EF; overflow: hidden; box-shadow: var(--sombra); }
.guia-rosto img { width: 100%; height: 100%; object-fit: cover; }
.guia-rosto.fala { animation: balanca .5s ease-in-out infinite alternate; }
@keyframes balanca { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-3px) rotate(3deg); } }
.balao { position: relative; flex: 1; margin: 0; background: #fff; border: 3px solid var(--borda); border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 1.12rem; font-weight: 800; box-shadow: var(--sombra); min-height: 52px; }
.balao.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.94); } to { transform: none; } }
.balao.bom { background: var(--verde-claro); border-color: var(--verde); }
.balao.ruim { background: var(--vermelho-claro); }
.balao:empty { visibility: hidden; }

/* ---------- mapa da missão (o bloco de solo 3D + a lista de lugares) ---------- */
.lista-est { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 12px; }
.passo { white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 4px 12px 4px 6px; border-radius: 999px; border: 3px solid var(--borda); background: #fff; font-weight: 900; font-size: .98rem; cursor: pointer; text-align: left; }
.passo .med { width: 42px; height: 42px; flex: none; }
.passo .nome { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.passo .est-st { display: flex; flex: none; } .passo .est-st svg { width: 16px; height: 16px; }
.passo.feita { background: var(--verde-claro); border-color: var(--verde); }
.passo.travada { opacity: .6; }
.passo.destaque { background: var(--terra); color: #fff; animation: pulsa 1.1s ease-in-out infinite alternate; }
@keyframes pulsa { from { box-shadow: var(--sombra), 0 0 0 0 rgba(255, 228, 92, .95); } to { box-shadow: var(--sombra), 0 0 0 9px rgba(255, 228, 92, .95); } }

/* ---------- faixa da estação ---------- */
.faixa { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; color: #fff; border: 3px solid var(--borda); border-radius: 22px; padding: 8px 10px; box-shadow: var(--sombra); background: linear-gradient(90deg, var(--cor-e), var(--cor-e)); }
.faixa .med { width: 58px; height: 58px; flex: none; }
.faixa h2 { font-size: clamp(1rem, 4.2vw, 1.6rem); flex: 1; min-width: 0; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.selo-txt { display: inline-block; background: #fff; color: var(--cor-e); border: 2px dashed var(--cor-e); border-radius: 10px; padding: 1px 8px; font-size: .85rem; font-weight: 900; letter-spacing: .02em; margin-top: 2px; text-shadow: none; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.corpo { margin-top: 8px; }

/* ---------- perguntas ---------- */
.perg { padding: 14px; margin-top: 10px; }
.selos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.selo-q { display: inline-flex; align-items: center; background: var(--rosa); color: #fff; border: 2px solid var(--borda); border-radius: 999px; padding: 1px 12px; font-size: .85rem; font-weight: 900; letter-spacing: .02em; }
.btn-teoria { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 14px 4px 8px; border-radius: 999px; border: 3px solid var(--borda); background: var(--amarelo); box-shadow: 0 4px 0 rgba(42, 22, 54, .25); font-size: .95rem; font-weight: 900; cursor: pointer; }
.btn-teoria svg { width: 28px; height: 28px; flex: none; }
.btn-teoria:active { transform: translateY(3px); }
.enunciado { font-size: 1.22rem; font-weight: 900; margin: 6px 0 10px; }
.opcoes { display: grid; gap: 10px; }
.opcao { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; text-align: left; padding: 10px 14px; border-radius: 18px; border: 3px solid var(--borda); background: #fff; font-size: 1.08rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.opcao .letra { flex: none; font-weight: 900; color: var(--rosa); }
.opcao.certa { background: var(--verde-claro); border-color: var(--verde); }
.opcao.errada { background: var(--vermelho-claro); opacity: .7; text-decoration: line-through; }
.opcao.pisca, .pisca { animation: pisca .55s ease-in-out infinite alternate; }
@keyframes pisca { from { box-shadow: 0 0 0 0 rgba(255, 201, 60, .95); } to { box-shadow: 0 0 0 9px rgba(255, 201, 60, .95); } }
.treme { animation: treme .35s; }
@keyframes treme { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.texto-base { background: var(--amarelo-claro); border: 3px solid var(--borda); border-radius: 16px; padding: 10px 12px; font-size: 1.05rem; margin: 0 0 10px; line-height: 1.5; }
#est-fim { margin-top: 12px; }
.result { text-align: center; padding: 18px; }
.estrelas-g { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.estrelas-g svg { width: 54px; height: 54px; }
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confete i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: cai 1.6s ease-in forwards; }
@keyframes cai { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); } }

/* ---------- certificado ---------- */
.aviso-livro { background: var(--amarelo-claro); border: 3px dashed var(--borda); border-radius: 16px; padding: 10px 14px; margin-top: 12px; font-weight: 900; }
.cert { border: 6px double var(--terra); border-radius: 20px; padding: 14px 12px 8px; background: #FFFDF7; }
.cert.quase { border-color: var(--tinta-2); }
.cert-topo { margin: 0 0 4px; font-family: var(--fonte-titulo); font-weight: 800; letter-spacing: .06em; color: var(--terra); font-size: .95rem; }
.cert h2 { font-size: 2.2rem; color: var(--terra); } .cert-txt { margin: 6px 0; font-size: 1.12rem; }
.cert-arte { width: 100%; max-width: 520px; margin: 8px auto; border: 3px solid var(--borda); border-radius: 16px; overflow: hidden; background: #FFF3B8; }
.cert-arte svg { width: 100%; height: auto; }
.cert-lia { width: 96px; height: 96px; margin: 6px auto; border-radius: 50%; border: 4px solid var(--borda); object-fit: cover; background: #FFE0EF; }
.placar-final { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.placar-final li { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--borda); border-radius: 14px; padding: 4px 10px; }
.placar-final .med { width: 40px; height: 40px; flex: none; }
.placar-final span { margin-left: auto; display: flex; align-items: center; gap: 4px; white-space: nowrap; } .placar-final span svg { width: 22px; height: 22px; }

/* ---------- dock: fala da Lia + botão de seguir sempre visíveis ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: flex-end; gap: 8px; max-width: 920px; margin: 0 auto; padding: 6px 12px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock .guia-rosto { width: 52px; height: 52px; }
.dock .balao { margin: 0; }
.dock .balao:empty { display: none; }
#dock-btn:empty { display: none; }
#dock-btn { flex: none; display: flex; gap: 8px; }
body.com-dock #app { padding-bottom: 190px; }
#est-fim { scroll-margin-bottom: 200px; }

/* ---------- triagem: o cartão do item + as caixas ---------- */
.palco { position: relative; min-height: 130px; display: grid; place-items: center; padding: 12px 6px; margin: 4px 0 10px; border-radius: 16px; background: rgba(255, 255, 255, .6); border: 3px dashed var(--tinta-2); overflow: hidden; }
.item-card { position: relative; z-index: 3; max-width: 100%; padding: 12px 20px; background: #fff; border: 3px solid var(--borda); border-radius: 18px; box-shadow: var(--sombra); font-family: var(--fonte); font-weight: 900; font-size: 1.28rem; text-align: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; line-height: 1.25; }
.item-card.entra { animation: card-entra .4s ease-out; }
@keyframes card-entra { from { opacity: 0; transform: translateX(-60px) scale(.9); } to { opacity: 1; transform: none; } }
.item-card.ok { background: var(--verde-claro); border-color: var(--verde); }
.item-card.arrasta { cursor: grabbing; z-index: 30; box-shadow: 0 16px 0 rgba(42, 22, 54, .2); }
.dica-arrasto { margin: 0 0 8px; text-align: center; font-size: .92rem; font-weight: 800; color: var(--tinta-2); }
.caixas { display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.caixa { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 80px; padding: 6px 4px; border-radius: 18px; border: 3px solid var(--borda); background: var(--cx, #1B5FB8); color: #fff; font-weight: 900; font-size: 1rem; line-height: 1.15; text-align: center; cursor: pointer; box-shadow: 0 5px 0 rgba(42, 22, 54, .3); transition: transform .12s; }
.caixa b { font-family: var(--fonte-titulo); font-size: 1.12rem; font-weight: 800; }
.caixa.alvo { transform: scale(1.06); outline: 4px solid var(--amarelo); }
.caixa.errada { opacity: .55; text-decoration: line-through; }
.caixa.pisca { animation: pisca .55s ease-in-out infinite alternate; }
.caixa.quica { animation: quica .35s; }
@keyframes quica { 40% { transform: scale(1.1); } }
.caixas.q4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.caixas.q5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.caixas.q5 .caixa:nth-child(4), .caixas.q5 .caixa:nth-child(5) { grid-column: span 1; }
.caixa small { font-size: .8rem; font-weight: 800; opacity: .95; }
.caixa .cx-ico { width: 34px; height: 34px; flex: none; } .caixa .cx-ico svg { width: 100%; height: 100%; }
/* lacunas com quadro de palavras */
.quadro-pal { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; margin: 4px 0 6px; border: 3px solid var(--borda); border-radius: 16px; background: var(--amarelo-claro); }
.ficha { min-height: 52px; padding: 6px 16px; border-radius: 14px; border: 3px solid var(--borda); background: #fff; box-shadow: 0 4px 0 rgba(42, 22, 54, .25); font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.25rem; cursor: pointer; }
.ficha:active { transform: translateY(3px); }
.ficha.usada { opacity: .35; text-decoration: line-through; pointer-events: none; box-shadow: none; }
.ficha.pisca { animation: pisca .55s ease-in-out infinite alternate; }
.lac-texto { background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 10px 14px; font-size: 1.15rem; line-height: 2.1; font-weight: 800; margin: 6px 0 4px; }
.lac { display: inline-block; min-width: 4.4ch; text-align: center; padding: 0 4px; margin: 0 2px; border-bottom: 5px solid var(--rosa); color: var(--rosa); }
.lac.cheia { background: var(--amarelo); border-radius: 8px 8px 0 0; color: var(--tinta); animation: gota .5s ease-out; }
@keyframes gota { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.lac.ativo { background: var(--amarelo-claro); border-radius: 8px 8px 0 0; animation: pisca .8s ease-in-out infinite alternate; }
/* ordenar */
.ordem-lista { display: grid; gap: 6px; margin: 6px 0 10px; }
.ordem-slot { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 3px 10px; border: 3px dashed var(--tinta-2); border-radius: 14px; background: rgba(255, 255, 255, .6); font-weight: 800; font-size: 1.02rem; }
.ordem-slot b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--rosa); color: #fff; display: grid; place-items: center; font-family: var(--fonte-titulo); }
.ordem-slot .gr { flex: none; width: 36px; height: 30px; } .ordem-slot .gr svg { width: 100%; height: 100%; }
.ordem-slot.cheio { border-style: solid; background: var(--verde-claro); border-color: var(--verde); }
.ordem-cards { display: grid; gap: 8px; }
.ordem-card { min-height: 52px; text-align: left; padding: 8px 14px; border-radius: 16px; border: 3px solid var(--borda); background: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); display: flex; align-items: center; gap: 10px; }
.ordem-card .gr { flex: none; width: 46px; height: 34px; } .ordem-card .gr svg { width: 100%; height: 100%; }
.ordem-card.usada { display: none; } .ordem-card.pisca { animation: pisca .55s ease-in-out infinite alternate; }
@media (min-width: 720px) { .ordem-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; } .ordem-wrap .ordem-lista { margin: 0; } }
/* peneira: a peneira desenhada acima da ordem */
.peneira-arte { display: flex; justify-content: center; margin: 2px 0 6px; } .peneira-arte svg { width: min(100%, 360px); height: auto; }
/* marcar vários cartões */
.cards-m { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 6px 0; }
.card-m { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 108px; padding: 6px 4px; border-radius: 18px; border: 3px solid var(--borda); background: #fff; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); font-weight: 900; font-size: .98rem; line-height: 1.15; text-align: center; cursor: pointer; }
.card-m .fig { width: 58px; height: 58px; flex: none; }
.card-m.marcado { background: var(--verde-claro); border-color: var(--verde); }
.card-m.errado { background: var(--vermelho-claro); opacity: .6; }
.card-m.pisca { animation: pisca .55s ease-in-out infinite alternate; }
.cards-n { text-align: center; font-weight: 900; color: var(--rosa); margin: 2px 0 0; }
/* V ou F */
.vf-lista { display: grid; gap: 8px; margin: 6px 0; }
.vf-linha { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 6px 8px 6px 12px; }
.vf-linha p { flex: 1; margin: 0; font-size: 1.04rem; font-weight: 800; line-height: 1.25; }
.vf-b { flex: none; width: 52px; min-height: 52px; border-radius: 14px; border: 3px solid var(--borda); background: #fff; font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .25); }
.vf-b.v { color: var(--verde); } .vf-b.f { color: var(--vermelho); }
.vf-linha.feita { background: var(--verde-claro); border-color: var(--verde); }
.vf-linha.feita .vf-b { display: none; } .vf-linha .vf-res { display: none; font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.4rem; width: 52px; text-align: center; }
.vf-linha.feita .vf-res { display: block; }
.vf-b.errada { background: var(--vermelho-claro); opacity: .5; } .vf-b.pisca { animation: pisca .55s ease-in-out infinite alternate; }
/* carta "uma marca só" */
.alts-marca { display: grid; gap: 8px; margin: 6px 0; }
.alt-marca { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; text-align: left; border: 3px solid var(--borda); border-radius: 16px; background: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.alt-marca .bola { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--borda); background: #fff; }
.alt-marca.marcada .bola { background: var(--tinta); }
.alt-marca.riscada { color: #8A7BA4; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--vermelho); } .alt-marca.riscada .bola { background: #E9E4F2; border-color: #9C8FB5; }
.alt-marca.certa { background: var(--verde-claro); border-color: var(--verde); }
.alt-marca.pisca { animation: pisca .55s ease-in-out infinite alternate; }
.aviso-marca { margin: 6px 0 0; padding: 6px 12px; text-align: center; font-weight: 900; border: 3px dashed var(--borda); border-radius: 14px; background: var(--amarelo-claro); }
/* edição: cartas */
.cartas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 auto 8px; max-width: 520px; }
.carta { padding: 6px; border: 3px solid var(--borda); border-radius: 14px; background: var(--rosa-claro); cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); min-height: 72px; display: grid; place-items: center; perspective: 400px; transition: transform .5s; transform-style: preserve-3d; }
.carta b { font-family: var(--fonte-titulo); font-size: 1.8rem; color: var(--rosa); }
.carta.virada { background: var(--amarelo); transform: rotateY(360deg); } .carta.feita { background: var(--verde-claro); border-color: var(--verde); } .carta.feita b { color: var(--verde); } .carta.feita svg { width: 34px; }
.passo-fav { margin: 6px 0 8px; font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.15rem; color: var(--rosa); }

/* ---------- mini-jogo: Chuva de palavras ---------- */
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 8px; }
.hud .vidas, .hud .pts { display: flex; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--borda); border-radius: 999px; padding: 4px 10px; font-weight: 900; }
.hud svg { width: 24px; height: 24px; }
.hud .btn-teoria { margin-left: 0; }
.pedido { flex: 1 1 100%; background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 8px 12px; font-size: 1.15rem; font-weight: 900; text-align: center; margin: 0; }
.chuva { position: relative; height: clamp(260px, calc(100vh - 290px), 540px); border: 3px solid var(--borda); border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: linear-gradient(#9FD8FF, #E8F7FF 70%, #BDE8A8 70%, #8BCB6E); }
.chuva-fundo { position: absolute; inset: 0; opacity: .5; } .chuva-fundo svg { width: 100%; height: 100%; }
.item { position: absolute; left: 0; top: 0; width: 100px; display: flex; flex-direction: column; align-items: center; pointer-events: none; will-change: transform; }
.item .fig { width: 64px; height: 64px; } .chuva.grande .item .fig { width: 78px; height: 78px; }
.item b { background: rgba(255, 255, 255, .96); border: 2px solid var(--borda); border-radius: 999px; padding: 0 9px; font-size: .98rem; white-space: nowrap; margin-top: -4px; }
.item.some { transition: opacity .2s, transform .2s; opacity: 0; }
.cesta { position: absolute; left: 0; top: 0; width: 110px; height: 84px; pointer-events: none; will-change: transform; } .cesta svg { width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: 6px 12px; font-weight: 900; opacity: 0; transition: opacity .2s; text-align: center; pointer-events: none; z-index: 5; }
.toast.on { opacity: 1; } .toast.bom { background: var(--verde-claro); border-color: var(--verde); } .toast.ruim { background: var(--vermelho-claro); border-color: var(--vermelho); }
.comecar { text-align: center; padding: 18px; }

/* ---------- 3D (Three.js) e plano B ---------- */
.cena3d { position: relative; height: clamp(190px, 33vh, 270px); border: 3px solid var(--borda); border-radius: 18px; overflow: hidden; box-shadow: var(--sombra); background: linear-gradient(#BFE6FF, #F2FBFF); touch-action: pan-y; margin: 8px 0; }
.cena3d.h-ceu { background: linear-gradient(#8CD3FF, #E6F7D0); } .cena3d.h-quente { background: linear-gradient(#FFD8A8, #FFF1DC); } .cena3d.h-agua { background: linear-gradient(#CFEAFF, #F4FBFF); } .cena3d.h-chuva { background: linear-gradient(#C9D4E4, #F0F4FA); }
.cv3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.rotulo3d { position: absolute; transform: translate(-50%, -100%); background: #fff; border: 2px solid var(--borda); border-radius: 999px; padding: 0 9px; font-size: .82rem; font-weight: 900; white-space: nowrap; pointer-events: none; z-index: 3; }
.rotulo3d.r-verde { background: #E2F6E8; } .rotulo3d.r-laranja { background: #FFE9C9; }
.rotulo3d.cap { left: 50%; top: 8px; bottom: auto; transform: translateX(-50%); font-size: .95rem; padding: 3px 12px; background: var(--amarelo); max-width: 94%; white-space: normal; text-align: center; }
.faixa-rot { position: absolute; left: 0; right: 0; top: 6px; display: flex; justify-content: center; pointer-events: none; z-index: 3; }
.dica3d { margin: 0; background: rgba(255, 255, 255, .88); border: 2px solid var(--borda); border-radius: 999px; padding: 0 10px; font-size: .78rem; font-weight: 900; }
.chip3d { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); margin: 0; max-width: 92%; background: var(--amarelo); border: 3px solid var(--borda); border-radius: 14px; padding: 4px 12px; font-size: .95rem; font-weight: 900; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 4; }
.chip3d.on { opacity: 1; }
.cena3d.pb, .cena3d.arte { height: auto; background: none !important; border: 0; box-shadow: none; overflow: visible; display: flex; justify-content: center; }
.cena3d.pb .pb-arte, .cena3d.arte .pb-arte { position: relative; display: block; width: min(100%, 520px); }
.cena3d.pb .pb-arte svg, .cena3d.arte .pb-arte svg { width: 100%; height: auto; border: 3px solid var(--borda); border-radius: 18px; box-shadow: var(--sombra); }
.cena3d.pb .cap { z-index: 5; }
.cena3d.pb.pb-cubo { height: clamp(190px, 33vh, 270px); border: 3px solid var(--borda); border-radius: 18px; background: linear-gradient(#8CD3FF, #E6F7D0) !important; box-shadow: var(--sombra); overflow: hidden; display: block; }
.btn-cena { display: flex; justify-content: center; margin: 6px 0 4px; }
/* plano B: cubo de solo em CSS 3D */
.cubo-ar { position: absolute; inset: 0; display: grid; place-items: center; perspective: 640px; }
.cubo { position: relative; width: 150px; height: 150px; transform-style: preserve-3d; animation: gira-cubo 16s linear infinite; transform: rotateX(-18deg); }
.face { position: absolute; inset: 0; border: 3px solid var(--borda); }
.face.f1 { transform: translateZ(75px); } .face.f2 { transform: rotateY(90deg) translateZ(75px); } .face.f3 { transform: rotateY(180deg) translateZ(75px); } .face.f4 { transform: rotateY(-90deg) translateZ(75px); } .face.topo { transform: rotateX(90deg) translateZ(75px); background: #4CA64C; }
.face.f1, .face.f2, .face.f3, .face.f4 { background: radial-gradient(circle at 20% 20%, #fff3 2px, transparent 3px) 0 0 / 14px 14px, linear-gradient(#3B2314 0 20%, #D2A868 20% 42%, #E3C48A 42% 62%, #CDB48C 62% 80%, #B5653A 80%); }
@keyframes gira-cubo { to { transform: rotateX(-18deg) rotateY(360deg); } }
/* plano B: animações dos SVGs */
.pb .gt { opacity: 0; } .pb .nivel { transform-box: fill-box; transform-origin: bottom; transform: scaleY(.01); }
.pb-arte.rodando .gt { animation: gota-cai .7s linear infinite; } .pb-arte.rodando .gt1 { animation-delay: .23s; } .pb-arte.rodando .gt2 { animation-delay: .46s; } .pb-arte.rodando .gt.lenta { animation-duration: 1.9s; }
@keyframes gota-cai { 0% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; } 100% { opacity: 0; transform: translateY(46px); } }
.pb-arte.rodando .nivel-a { animation: nivel-a 5s ease-out forwards; } .pb-arte.rodando .nivel-b { animation: nivel-b 6s ease-out forwards; }
@keyframes nivel-a { to { transform: scaleY(9); } } @keyframes nivel-b { to { transform: scaleY(3.2); } }
.pb-arte.rodando .agua-fun { animation: agua-fun 3.6s ease-in forwards; transform-box: fill-box; transform-origin: bottom; } @keyframes agua-fun { to { transform: scaleY(0); opacity: 0; } }
.pb-arte.rodando .roda { animation: gira-roda 1.2s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes gira-roda { to { transform: rotate(360deg); } }
.pb-arte.rodando .vaso-pb { animation: vaso-m 16.5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; } @keyframes vaso-m { 0% { transform: scale(.55, .35); } 30% { transform: scale(1, 1); } 85% { transform: scale(1, 1); } 100% { transform: scale(1, 1); } }
.pb-arte.rodando .barro-pb { animation: barro-c 16.5s linear infinite; } @keyframes barro-c { 0% { fill: #7B4A2D; } 30% { fill: #7B4A2D; } 52% { fill: #B8896A; } 70% { fill: #B8896A; } 82% { fill: #C4562B; } 100% { fill: #C4562B; } }
.pb-arte.rodando .nuvem-pb { animation: nuvem-d 18s linear infinite alternate; } @keyframes nuvem-d { to { transform: translateX(40px); } }
.pb-arte.rodando .onda-pb { animation: onda-d 2.2s ease-in-out infinite alternate; } @keyframes onda-d { to { transform: translateX(6px); opacity: .3; } }
.pb-arte.rodando .chove-pb { animation: chove-d .8s linear infinite; } @keyframes chove-d { to { transform: translateY(40px); opacity: 0; } }
.pb .chove-pb { opacity: 0; } .pb-arte.rodando .chove-pb { opacity: 1; }
.pb-arte.rodando .copo-pb1 { animation: copo1 5s ease-out forwards; transform-box: fill-box; transform-origin: bottom; } .pb-arte.rodando .copo-pb2 { animation: copo2 5s ease-out forwards; transform-box: fill-box; transform-origin: bottom; }
@keyframes copo1 { from { transform: scaleY(.2); } } @keyframes copo2 { from { transform: scaleY(.1); } }

/* ---------- cartão da teoria ("Ver a teoria") ---------- */
.teo-fundo { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 10px; background: rgba(42, 22, 54, .62); animation: entra .2s ease-out; }
.teo-cartao { position: relative; width: min(100%, 560px); max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; background: var(--papel); border: 4px solid var(--borda); border-radius: 24px; box-shadow: 0 10px 0 rgba(42, 22, 54, .35); padding: 14px 14px 12px; }
.teo-rolagem { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-right: 2px; }
.teo-topo { display: flex; align-items: center; gap: 10px; padding-right: 58px; }
.teo-topo .ic-livro { width: 46px; height: 46px; flex: none; }
.teo-topo h2 { font-size: 1.35rem; color: var(--rosa); }
.teo-pag { display: inline-block; margin-top: 2px; background: var(--rosa); color: #fff; border: 2px solid var(--borda); border-radius: 999px; padding: 0 10px; font-size: .8rem; font-weight: 900; }
.teo-x { position: absolute; top: 8px; right: 8px; }
.teo-arte { margin: 10px 0; border: 3px solid var(--borda); border-radius: 16px; overflow: hidden; background: #fff; }
.teo-arte svg { width: 100%; height: auto; }
.teo-sec + .teo-sec { margin-top: 10px; padding-top: 8px; border-top: 3px dashed var(--tinta-2); }
.teo-corpo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.teo-corpo li { position: relative; padding: 8px 12px 8px 30px; background: #fff; border: 2px solid var(--borda); border-radius: 14px; font-size: 1.05rem; line-height: 1.4; font-weight: 700; }
.teo-corpo li::before { content: ""; position: absolute; left: 10px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--rosa); border: 2px solid var(--borda); }

/* ---------- campo da minhoca (canvas): grama, moitas e florzinhas; a trilha da minhoca fica marcada ---------- */
function pintaCampo(g, W, H, U) {
  var gr = g.createLinearGradient(0, 0, 0, H), r = rnd(77), i; gr.addColorStop(0, '#8ED36B'); gr.addColorStop(1, '#4FA24A');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (i = 0; i < 9; i++) { g.fillStyle = i % 2 ? 'rgba(255,255,255,.08)' : 'rgba(20,90,40,.1)'; g.beginPath(); g.ellipse(r() * W, r() * H, (40 + r() * 70) * U, (22 + r() * 30) * U, 0, 0, 6.3); g.fill(); }
  g.strokeStyle = '#2E8B3E'; g.lineWidth = 2 * U; g.lineCap = 'round';
  for (i = 0; i < Math.round(W * H / 5200); i++) { var x = r() * W, y = r() * H; g.beginPath(); g.moveTo(x - 4 * U, y); g.lineTo(x - 6 * U, y - 9 * U); g.moveTo(x, y); g.lineTo(x, y - 12 * U); g.moveTo(x + 4 * U, y); g.lineTo(x + 7 * U, y - 8 * U); g.stroke(); }
  for (i = 0; i < Math.round(W * H / 16000); i++) { var fx = r() * W, fy = r() * H, cor = ['#fff', '#FFE45C', '#FF8FC0'][i % 3]; g.fillStyle = cor; for (var k = 0; k < 5; k++) { g.beginPath(); g.arc(fx + Math.cos(k * 1.26) * 4 * U, fy + Math.sin(k * 1.26) * 4 * U, 2.6 * U, 0, 6.3); g.fill(); } g.fillStyle = '#FF8A3D'; g.beginPath(); g.arc(fx, fy, 2.2 * U, 0, 6.3); g.fill(); }
}

    if (nome === 'pop') { nota(c, 660, 0, 0.09, 'triangle', 0.12); nota(c, 990, 0.04, 0.08, 'sine', 0.08); }
    else if (nome === 'acerto') { [523, 659, 784, 1047].forEach(function (f, i) { nota(c, f, i * 0.07, 0.22, 'triangle', 0.12); }); }
    else if (nome === 'erro') { nota(c, 330, 0, 0.16, 'sine', 0.1); nota(c, 262, 0.1, 0.22, 'sine', 0.1); }

    else if (nome === 'festa') { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { nota(c, f, i * 0.09, 0.3, 'triangle', 0.12); }); }

/* ===================== 9 · EDIÇÃO DA PROVA (questões abertas, colunas do jeito da folha e cartas de comando) · CERTIFICADO · INÍCIO ===================== */
/* colunas: a coluna A é numerada; em cada frase da coluna B (na ordem da folha) a criança toca no número certo.
   cfg: {prompt, f, teo, h, resumo, tA, tB, A:[nomes], B:[{t, n}]} */
function colunas(cfg) {
  return function (prox) {
    var meu = EST, erros = 0, feitas = 0, N = cfg.B.length, errosL = {};
    var h = '<div class="cartao perg">' + selos(cfg.f, cfg.teo) + '<p class="enunciado" id="enunciado" data-fala></p><div class="col-wrap"><div class="col-a"><b class="col-t">' + cfg.tA + '</b>' +
      cfg.A.map(function (a, i) { return '<p><span class="col-n">' + (i + 1) + '</span>' + a + '</p>'; }).join('') + '</div><div class="col-b" id="col-b"><b class="col-t">' + cfg.tB + '</b>';
    cfg.B.forEach(function (b, i) {
      h += '<div class="col-lin" data-i="' + i + '"><p><span class="col-par">(&nbsp;&nbsp;&nbsp;)</span> ' + b.t + '</p><div class="col-bts">' + cfg.A.map(function (a, k) { return '<button type="button" class="col-bt" data-n="' + (k + 1) + '" aria-label="Número ' + (k + 1) + '">' + (k + 1) + '</button>'; }).join('') + '</div></div>';
    });
    $('est-corpo').innerHTML = h + '</div></div><p class="col-seq" id="col-seq"></p></div>';
    limparBalao(); dockLimpa(); EST.ajuda = cfg.h; dizerPrompt(cfg.prompt, 'enunciado');
    $('col-b').addEventListener('click', function (ev) {
      var b = ev.target.closest('.col-bt'); if (!b || !ativo(meu) || b.classList.contains('errada')) return;
      var lin = b.closest('.col-lin'), i = +lin.dataset.i, item = cfg.B[i];
      if (+b.dataset.n === item.n) {
        lin.classList.add('feita'); lin.querySelector('.col-par').textContent = '( ' + item.n + ' )'; sfx('acerto'); feitas++;
        if (feitas >= N) { confete(26); $('col-seq').textContent = 'Sequência, de cima para baixo: ' + cfg.B.map(function (x) { return x.n; }).join(' – '); resumo(cfg.resumo, function () { prox(erros); }); }
        else balaoTexto('Isso! ' + cfg.A[item.n - 1] + '.', 'bom');
      } else {
        erros++; errosL[i] = (errosL[i] || 0) + 1; b.classList.add('errada'); marcaErro(lin); sfx('erro');
        if (errosL[i] === 1) dizer(cfg.h, 'balao', 'ruim');
        else { lin.querySelector('[data-n="' + item.n + '"]').classList.add('pisca'); dizer('pisca', 'balao', 'ruim'); }
        garanteVisivel(lin);
      }
    });
  };
}
/* carta "uma marca só" (questão 9): a marca antiga tem de ser RISCADA antes de marcar a certa */
function cartaMarca(prox) {
  var meu = EST, ops = ['Sul', 'Centro-Oeste', 'Sudeste', 'Norte'], LET = ['a)', 'b)', 'c)', 'd)'], CERTA = 2, ANTIGA = 0, erros = 0, ativa = ANTIGA, feito = false;
  $('est-corpo').innerHTML = '<div class="cartao perg">' + selos('Comando de prova', 'ED') + '<p class="enunciado" id="enunciado" data-fala></p><p class="texto-base">Questão 9: qual região é formada por Minas Gerais, Espírito Santo, São Paulo e Rio de Janeiro?</p>' +
    '<div class="alts-marca" id="alts">' + ops.map(function (t, i) { return '<button type="button" class="alt-marca' + (i === ANTIGA ? ' marcada' : '') + '" data-i="' + i + '"><span class="bola"></span><span>' + LET[i] + ' ' + nq(t) + '</span></button>'; }).join('') + '</div></div>';
  limparBalao(); dockLimpa(); EST.ajuda = 'edi-m2'; dizer('edi-m1', 'enunciado');
  $('alts').addEventListener('click', function (ev) {
    var b = ev.target.closest('.alt-marca'); if (!b || feito || !ativo(meu) || b.classList.contains('riscada')) return; var i = +b.dataset.i;
    if (b.classList.contains('marcada')) { b.classList.remove('marcada', 'pisca'); b.classList.add('riscada'); ativa = -1; sfx('pop'); limparBalao(); EST.ajuda = 'edi-h5'; return; }
    if (ativa >= 0 || i !== CERTA) {
      erros++; marcaErro(b); sfx('erro');
      if (ativa >= 0) { var m = document.querySelector('#alts .marcada'); if (m) m.classList.add('pisca'); dizer('edi-m2', 'balao', 'ruim'); } else dizer('edi-h5', 'balao', 'ruim');
      garanteVisivel($('alts')); return;
    }
    b.classList.add('marcada', 'certa'); feito = true; sfx('acerto'); confete(20); resumo('edi-m3', function () { prox(erros); });
  });

document.addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('button'); if (b) b.__clk = Date.now(); }, true);
document.addEventListener('pointerup', function (ev) {
  if (ev.pointerType === 'mouse') return;
